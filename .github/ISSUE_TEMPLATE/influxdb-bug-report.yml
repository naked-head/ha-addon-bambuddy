name: InfluxDB App — Bug Report
description: Problem installing, updating, or configuring the InfluxDB App for Home Assistant.
labels: ["app:influxdb"]
body:
  - type: markdown
    attributes:
      value: |
        ## Before you continue

        This repository only packages InfluxDB OSS to run as a Home Assistant
        **App** (formerly called "Add-on") — it wires together Docker, s6-overlay,
        `config.yaml`, and the Supervisor integration. **It is not InfluxDB itself.**

        If your problem is about InfluxDB's own behavior — query results, the Flux/SQL
        language, the Web UI, dashboards, task/alert engine, client libraries, etc. —
        please report it upstream instead, where the actual maintainers can act on it:

        👉 https://github.com/influxdata/influxdb/issues

        Issues about InfluxDB's own behavior opened here will be redirected and closed,
        which just delays getting help. Rule of thumb: if reinstalling the App or
        changing one of its options wouldn't affect the problem, it's an upstream issue.

        **Note:** attachments sent via email reply to a GitHub issue notification are
        automatically stripped and deleted by GitHub — they will not reach this issue.
        Please attach files directly on github.com instead.

  - type: checkboxes
    id: confirm-scope
    attributes:
      label: Confirm this issue belongs here
      options:
        - label: >-
            I am aware that naked-head is a grumpy maintainer, so it can happen that
            my issue will be closed quickly when essential information is missing
            (no logs, no description, no steps to reproduce, etc.).
          required: true
        - label: >-
            This is about installing, updating, or configuring the InfluxDB App itself
            (not about InfluxDB's own query/UI/task-engine behavior once it's running).
          required: true
        - label: My Home Assistant version is up to date.
          required: true
        - label: >-
            I have checked, via HACS' 3-dot menu → "Update Information" on this App,
            that I am running the **latest** released version.
          required: true
        - label: I have read the App's README/DOCS.md before opening this issue.
          required: true
        - label: >-
            I have checked existing issues (including closed ones) to make sure
            this isn't a duplicate.
          required: true
        - label: >-
            I confirm this is genuinely an issue with the App (not just a question
            about how a feature works).
          required: true
        - label: |
            I confirm that I did not actually read any of the points above and just checked them all. |
            I didn't want to waste time on details, so I skipped reading or following any existing instructions. |
            Instead, I'd like naked-head to spend their free time explaining things to me — that's what open source is for, right? |
            I live by the motto: better to ask twice than think once. |
            It's naked-head's own fault for offering open-source software and free support.

  - type: input
    id: app-version
    attributes:
      label: InfluxDB App version
      description: Settings → Apps → InfluxDB → top of page.
      placeholder: e.g. 2.8.0-1
    validations:
      required: true

  - type: dropdown
    id: ha-install
    attributes:
      label: Home Assistant installation type
      options:
        - Home Assistant OS
        - Home Assistant Supervised
        - Other / not sure
    validations:
      required: true

  - type: dropdown
    id: arch
    attributes:
      label: Architecture
      options:
        - amd64
        - aarch64
        - Not sure
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: App configuration (YAML)
      description: >-
        Settings → Apps → InfluxDB → Configuration tab → switch to YAML mode
        and paste it here. Remove/redact passwords and tokens first
        (init_password, init_admin_token).
      render: yaml

  - type: textarea
    id: logs
    attributes:
      label: App logs
      description: Settings → Apps → InfluxDB → Log tab. Please redact anything sensitive.
      render: shell