name: Update Bambu Studio API

on:
  schedule:
    - cron: '0 6 * * *'  # ogni giorno alle 6:00 UTC
  workflow_dispatch:

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Get latest BambuStudio release with Linux AppImage
        id: upstream
        run: |
          LATEST=$(curl -s https://api.github.com/repos/bambulab/BambuStudio/releases/latest \
            | jq -r '.tag_name' | sed 's/^v//')
          echo "Latest version: ${LATEST}"
          HAS_APPIMAGE=$(curl -s "https://api.github.com/repos/bambulab/BambuStudio/releases/tags/v${LATEST}" \
            | jq -r '.assets[].browser_download_url' \
            | grep -i 'ubuntu' | grep '\.AppImage$' | head -n1)
          echo "AppImage URL found: '${HAS_APPIMAGE}'"
          if [ -z "$HAS_APPIMAGE" ]; then
            echo "No Linux AppImage for v${LATEST}, skipping."
            echo "version=" >> $GITHUB_OUTPUT
          else
            echo "version=$LATEST" >> $GITHUB_OUTPUT
          fi

      - name: Get current version from Dockerfile
        id: current
        run: |
          CURRENT=$(grep 'ARG BAMBU_VERSION=' bambu-studio-api/Dockerfile \
            | sed 's/ARG BAMBU_VERSION=//')
          echo "version=$CURRENT" >> $GITHUB_OUTPUT

      - name: Compare versions
        id: compare
        run: |
          if [ -n "${{ steps.upstream.outputs.version }}" ] && \
             [ "${{ steps.upstream.outputs.version }}" != "${{ steps.current.outputs.version }}" ]; then
            echo "update_needed=true" >> $GITHUB_OUTPUT
          else
            echo "update_needed=false" >> $GITHUB_OUTPUT
          fi

            - name: Update Dockerfile, config.yaml and CHANGELOG.md
        if: steps.compare.outputs.update_needed == 'true'
        run: |
          set -euo pipefail
          NEW_VER="${{ steps.upstream.outputs.version }}"
          OLD_VER="${{ steps.current.outputs.version }}"
          CL="bambu-studio-api/CHANGELOG.md"
          REPO_URL="https://github.com/${{ github.repository }}"

          sed -i "s/ARG BAMBU_VERSION=.*/ARG BAMBU_VERSION=${NEW_VER}/" \
            bambu-studio-api/Dockerfile

          OLD_ADDON=$(grep '^version:' bambu-studio-api/config.yaml \
            | sed -E 's/version:[[:space:]]*"?([^"]+)"?/\1/')
          NEW_ADDON=$(echo "$OLD_ADDON" | awk -F. '{printf "%s.%s.%s", $1, $2, $3+1}')
          sed -i "s/^version:.*/version: \"${NEW_ADDON}\"/" \
            bambu-studio-api/config.yaml

          DATE=$(date +%Y-%m-%d)

          # Insert the new section right after "## [Unreleased]"
          awk -v ver="$NEW_ADDON" -v d="$DATE" -v old="$OLD_VER" -v new="$NEW_VER" '
            { print }
            /^## \[Unreleased\]$/ && !ins {
              print ""
              print "## [" ver "] - " d
              print "- Bump Bambu Studio from " old " to " new "."
              ins = 1
            }
          ' "$CL" > "$CL.tmp" && mv "$CL.tmp" "$CL"

          # Refresh the link references at the bottom
          sed -i "s|^\[Unreleased\]:.*|[Unreleased]: ${REPO_URL}/compare/bambu-studio-api-v${NEW_ADDON}...HEAD|" "$CL"
          sed -i "/^\[Unreleased\]:/a [${NEW_ADDON}]: ${REPO_URL}/compare/bambu-studio-api-v${OLD_ADDON}...bambu-studio-api-v${NEW_ADDON}" "$CL"

      - name: Open Pull Request
        if: steps.compare.outputs.update_needed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: update/bambu-studio-${{ steps.upstream.outputs.version }}
          commit-message: "chore: bump Bambu Studio to ${{ steps.upstream.outputs.version }}"
          title: "Update Bambu Studio API to ${{ steps.upstream.outputs.version }}"
          delete-branch: true
          body: |
            Automated update: bumps `BAMBU_VERSION` in `bambu-studio-api/Dockerfile`
            and `version` in `bambu-studio-api/config.yaml` to match the latest
            [BambuStudio release](https://github.com/bambulab/BambuStudio/releases/tag/${{ steps.upstream.outputs.version }}).

            Merge this PR to make the update available in your HA add-on repository.
          labels: automated, dependencies
