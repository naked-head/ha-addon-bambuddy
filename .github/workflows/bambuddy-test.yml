name: BamBuddy Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    name: Bambuddy smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build App image
        uses: docker/build-push-action@v6
        with:
          context: ./bambuddy
          file: ./bambuddy/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: bambuddy:test
          cache-from: type=gha,scope=bambuddy-amd64
          cache-to: type=gha,mode=max,scope=bambuddy-amd64

      - name: Build Supervisor mock
        run: docker build -t supervisor-mock test/mock/

      - name: Run smoke tests
        run: ./bambuddy/test/smoke.sh