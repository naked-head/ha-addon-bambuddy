name: BamBuddy Test
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    name: Bambuddy smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build App image
        run: |
          docker build \
            -t bambuddy:test bambuddy/

      - name: Build Supervisor mock
        run: docker build -t supervisor-mock test/mock/

      - name: Run smoke tests
        run: ./bambuddy/test/smoke.sh
